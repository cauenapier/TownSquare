<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>TownSquare — staging</title>
    <link rel="stylesheet" href="/widget.css" />
    <link rel="stylesheet" href="/page.css" />
    <style>
      .staging-banner {
        width: min(1100px, 100%);
        margin: 24px auto 0;
        padding: 12px 16px;
        border: 1px solid var(--ink, #333);
        border-radius: 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 12px;
        font: 500 0.95rem/1.4 system-ui, sans-serif;
      }
      .staging-banner__tag {
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .staging-banner__origin {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        opacity: 0.85;
      }
      .staging-note {
        width: min(1100px, 100%);
        margin: 6px auto 0;
        font: 400 0.85rem/1.4 system-ui, sans-serif;
        opacity: 0.7;
      }
      .staging-controls {
        width: min(1100px, 100%);
        margin: 10px auto 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        font: 400 0.9rem/1.4 system-ui, sans-serif;
      }
      .staging-controls label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .staging-scroll-spacer {
        height: 1000px;
      }
      .dev-shell:not(.staging-has-scroll-padding) .staging-scroll-spacer {
        display: none;
      }
    </style>
  </head>
  <body class="dev-page">
    <main class="dev-shell">
      <div class="staging-banner" role="status">
        <span class="staging-banner__tag">Staging</span>
        <span>Live widget served by this instance, connected to</span>
        <span class="staging-banner__origin" id="staging-origin"></span>
      </div>
      <p class="staging-note">
        This page mounts the real widget against this server's own
        <code>/live</code> scene, so what you see is the deployed branch's widget,
        server, and protocol end to end.
      </p>

      <!-- Scroll padding toggle: test widget-not-visible when the scene is off-screen. -->
      <div class="staging-controls">
        <label for="staging-scroll-padding">
          <input type="checkbox" id="staging-scroll-padding" />
          Extra scroll padding (1000px above &amp; below widget)
        </label>
      </div>

      <div class="staging-scroll-spacer" aria-hidden="true"></div>

      <section class="townsquare-host" aria-label="TownSquare staging scene">
        <div id="townsquare-root"></div>
      </section>

      <div class="staging-scroll-spacer" aria-hidden="true"></div>
    </main>

    <script type="module">
      import { mountTownSquare } from "/townsquare.mjs";

      const origin = window.location.origin;
      document.getElementById("staging-origin").textContent = origin;

      // Scroll padding toggle: test widget-not-visible when the mount is off-screen.
      const SCROLL_PADDING_KEY = "townsquare-staging-scroll-padding";
      const shell = document.querySelector(".dev-shell");
      const scrollPaddingToggle = document.getElementById("staging-scroll-padding");

      function setScrollPadding(enabled) {
        shell.classList.toggle("staging-has-scroll-padding", enabled);
        scrollPaddingToggle.checked = enabled;
        try {
          localStorage.setItem(SCROLL_PADDING_KEY, enabled ? "1" : "0");
        } catch {}
      }

      let scrollPaddingEnabled = true;
      try {
        const saved = localStorage.getItem(SCROLL_PADDING_KEY);
        if (saved === "0") scrollPaddingEnabled = false;
      } catch {}
      setScrollPadding(scrollPaddingEnabled);

      scrollPaddingToggle.addEventListener("change", () => {
        setScrollPadding(scrollPaddingToggle.checked);
      });

      mountTownSquare(document.getElementById("townsquare-root"), {
        // Defaults to window.location.origin; stated here so the page is an
        // honest copy of a real embed snippet.
        serverOrigin: origin,
        socketPath: "/live",
        theme: "host",
      });
    </script>
  </body>
</html>
