<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soccer ball test</title>
    <style>
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f6f3ec; color: #2a2926; }
      main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
      .note { color: #6b675f; margin: 0 0 16px; }
      .host { border: 1px solid #e4ded2; border-radius: 12px; background: #fbf9f4; overflow: hidden; }
      kbd { background: #efe9dd; border-radius: 4px; padding: 1px 6px; font: 13px monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Soccer ball test</h1>
      <p class="note">
        Walk with <kbd>←</kbd> / <kbd>→</kbd> into the ball to kick it. Speed
        drives the kick + loft. Open this URL in a second tab to see it shared.
      </p>
      <div class="host"><div id="townsquare-root"></div></div>
    </main>

    <script type="module">
      import { mountTownSquare } from "/townsquare.mjs";

      const siteKey = new URLSearchParams(location.search).get("siteKey") || "";
      mountTownSquare(document.getElementById("townsquare-root"), {
        serverOrigin: location.origin,
        socketPath: "/live",
        siteKey,
        theme: "host",
      });
    </script>
  </body>
</html>
